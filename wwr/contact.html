<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Company</title>
    <meta name="author" content="Andrew Swann Riese">
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Rafting Logo" width="200">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <div class="company-details">
                <h1>White Water Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </div>
            <div class="map-card">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.717340510354!2d-122.08424968469269!3d37.42206597982506!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb0b8240fcc17%3A0x4b0e9c15f5c2e17b!2sGoogleplex!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>

        <section class="contact-section">
            <div class="contact-form">
                <h2>Contact Us</h2>
                <form action="#" method="post">
                    <div class="field-group">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" placeholder="Placeholder">
                    </div>
                    <div class="field-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Placeholder">
                    </div>
                    <fieldset class="radio-group">
                        <legend>Message Purpose</legend>
                        <label><input type="radio" name="purpose" value="general" checked> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </fieldset>
                    <div class="field-group full-width">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6"
                          placeholder="Type here"></textarea>
                    </div>
                    <label class="checkbox-label"><input type="checkbox" name="newsletter"> Please
                        Subscribe me to the monthly newsletter</label>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="employee-section">
            <h2>Employee Profiles</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/happycustomers.avif" alt="Trip Leader">
                    <figcaption>Trip Leader</figcaption>
                </figure>
                <figure>
                    <img src="images/happycustomers.avif" alt="Reservation Manager">
                    <figcaption>Reservation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/happycustomers.avif" alt="Guide Coordinator">
                    <figcaption>Guide Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Footer Content including Social Media Icons/Links</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
